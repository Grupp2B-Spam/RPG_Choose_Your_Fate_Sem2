# Storage for the database RecapManager owns. One volume per database, because
# there is one database per service.
#
# persistentVolumeReclaimPolicy: Retain means "kubectl delete -R -f kubernetes"
# leaves the data behind, so an accidental teardown does not destroy authored
# content. The README says how to wipe it on purpose.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recap-vault-data
  labels:
    app.kubernetes.io/part-of: choose-your-fate
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: choose-your-fate-local
  claimRef:
    namespace: choose-your-fate
    name: recap-vault-data
  hostPath:
    path: /var/lib/choose-your-fate/recap-vault
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recap-vault-data
  namespace: choose-your-fate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: choose-your-fate-local
  resources:
    requests:
      storage: 2Gi
