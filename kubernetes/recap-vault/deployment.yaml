# The database RecapManager owns.
#
# MYSQL_DATABASE is deliberately not set: the schema file creates the database
# itself (CREATE SCHEMA `recap-vault`), and having the server create it as well
# would mean two places decide one name.
#
# The init script comes from a ConfigMap that scripts/setup.ps1 builds from
# microservices/recapManager/src/main/resources/01_schema_recap_vault.sql. The
# SQL is not copied into this tree, so the repository holds one schema file
# rather than two that can drift apart.
#
# MySQL runs init scripts only when the data directory is empty. Editing the
# schema file does not re-run it against an existing volume -- the README says
# how to reset it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recap-vault
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: recap-vault
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce storage: the old pod has to let go of the data directory
    # before the new one can take it, so a rolling update would wait for itself.
    # Two MySQL processes on one data directory would also corrupt it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recap-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recap-vault
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:9.5.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recap-vault-credentials
                  key: root-password
          # The server answers "mysqladmin ping" before it has finished recovery
          # and before it will accept a real query, so a startupProbe absorbs the
          # first start and the other two stay strict. Liveness restarts only a
          # process that has genuinely stopped answering; readiness is what takes
          # it out of the Service while it is busy.
          startupProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" > /dev/null']
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recap-vault-data
        - name: init
          configMap:
            name: recap-vault-init
