# The database RecapManager owns.
#
# MYSQL_DATABASE is not set: the schema file creates the database itself
# (CREATE SCHEMA `recap-vault`), and setting it here would be a second place that
# decides the name.
#
# scripts/setup.ps1 builds the init ConfigMap from the service's own schema file
# in microservices/recapManager/, so there is one copy rather than two.
#
# MySQL runs init scripts only when the data directory is empty. Editing the
# schema does not re-run them against an existing volume; the README says how to
# reset it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recap-vault
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: recap-vault
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce storage: the old pod has to release the data directory before
    # the new one can mount it, so a rolling update would wait for itself.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recap-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recap-vault
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:9.5.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recap-vault-credentials
                  key: root-password
          # The server answers "mysqladmin ping" before it has finished recovery,
          # so the startupProbe absorbs the first start and the other two stay
          # strict. Readiness runs a real query; liveness only pings.
          startupProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" > /dev/null']
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recap-vault-data
        - name: init
          configMap:
            name: recap-vault-init
