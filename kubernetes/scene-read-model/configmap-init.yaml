# Creates the two database users the scene services authenticate as.
#
# This is the same arrangement as microservices/Scenes/mongo/init.js -- indexer
# with readWrite, manager with read -- with one difference: the passwords come
# from the Secret through the environment instead of being written into the
# script. The repository's init.js has them in plain text, which is survivable
# for a local compose file and is not something to carry into a manifest tree
# that is meant to be committed.
#
# Mongo runs everything in /docker-entrypoint-initdb.d once, on the first start
# with an empty data directory, and never again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-read-model-init
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: scene-read-model
    app.kubernetes.io/part-of: choose-your-fate
data:
  01-create-users.sh: |
    #!/bin/bash
    set -euo pipefail

    mongosh --quiet \
      --username "$MONGO_INITDB_ROOT_USERNAME" \
      --password "$MONGO_INITDB_ROOT_PASSWORD" \
      --authenticationDatabase admin <<EOJS
    const scenes = db.getSiblingDB("scenes");
    scenes.createUser({
      user: "indexer",
      pwd: "$SCENE_INDEXER_PASSWORD",
      roles: [{ role: "readWrite", db: "scenes" }]
    });
    scenes.createUser({
      user: "manager",
      pwd: "$SCENE_MANAGER_PASSWORD",
      roles: [{ role: "read", db: "scenes" }]
    });
    EOJS
