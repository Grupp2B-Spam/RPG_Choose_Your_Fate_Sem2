# MongoDB holding the denormalised scene documents.
#
# The read half of the CQRS split: StoryContentManager owns the truth about
# content in MySQL, shaped by how authors edit it, and this holds one document
# per scene shaped by how the game reads it. It can be thrown away and rebuilt
# from events, which is why losing it is an inconvenience and not a data loss.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-read-model
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: scene-read-model
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-read-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-read-model
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: root-password
            # Read by the init script on first start only. They are set on every
            # start because a container cannot know whether this is the first.
            - name: SCENE_INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: indexer-password
            - name: SCENE_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: manager-password
          # Every one of these starts a mongosh process, which is a Node
          # runtime and takes seconds rather than milliseconds.
          #
          # timeoutSeconds matters more than it looks. It defaults to 1 second,
          # and leaving it off the startupProbe is what broke this pod: mongosh
          # could not start, connect and answer within a second, so the startup
          # probe failed every time and Kubernetes killed the container again
          # and again. The pod was in a restart loop caused entirely by the
          # probe, while MongoDB itself was perfectly healthy.
          #
          # Worth remembering as a general rule: an exec probe that starts a
          # runtime always needs an explicit timeout, and the default is far too
          # short for anything heavier than a shell builtin.
          startupProbe:
            exec:
              command: ["sh", "-c", 'mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep -q 1']
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 30
          # Unauthenticated on purpose: ping is allowed before authentication,
          # and liveness should ask the cheapest question that distinguishes a
          # live process from a dead one. Whether credentials work is a
          # readiness question, and it is asked below.
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q 1']
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep -q 1']
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scene-read-model-data
        - name: init
          configMap:
            name: scene-read-model-init
            defaultMode: 0555
