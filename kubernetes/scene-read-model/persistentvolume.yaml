# Storage for the scene read model.
#
# Two services share this datastore: scene-indexer writes it, scene-manager reads
# it. The database enforces that with two users and different grants rather than
# trusting the code. They are still separately released, so the document format
# is a contract between them.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: scene-read-model-data
  labels:
    app.kubernetes.io/part-of: choose-your-fate
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: choose-your-fate-local
  claimRef:
    namespace: choose-your-fate
    name: scene-read-model-data
  hostPath:
    path: /var/lib/choose-your-fate/scene-read-model
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scene-read-model-data
  namespace: choose-your-fate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: choose-your-fate-local
  resources:
    requests:
      storage: 2Gi
