# One namespace for the whole system, so it can be listed and deleted as a unit.
#
# The folder is named 00- because "kubectl apply -R -f kubernetes" walks the tree
# in lexical order, and the namespace has to exist first.
apiVersion: v1
kind: Namespace
metadata:
  name: choose-your-fate
  labels:
    app.kubernetes.io/part-of: choose-your-fate
