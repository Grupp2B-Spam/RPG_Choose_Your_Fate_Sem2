# The shared message broker. One for the whole system, as in the root
# docker-compose.yml.
#
# The management plugin is kept because a topic exchange with no bound queue
# discards messages silently, and looking at the queue list is the only way to
# tell that apart from a working system.
#
# Replicas stay at 1. A second replica would be a second independent broker
# holding different queues, not a cluster: clustering needs stable network
# identities, which means a StatefulSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  strategy:
    # The volume is ReadWriteOnce, so the old pod must release it before the new
    # one can mount it. A rolling update would deadlock waiting for itself.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            # The Prometheus plugin, enabled by default in this image. Nothing
            # scrapes it; the probes below use it.
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          # HTTP and TCP, not "rabbitmq-diagnostics". Every rabbitmq-diagnostics
          # call starts a second Erlang VM, which took over 20 seconds here and
          # put a healthy broker in a restart loop caused by its own probe.
          #
          # Startup and liveness use the Prometheus plugin on 15692, which only
          # answers once the broker core is up. Readiness opens a TCP connection
          # on 5672, which is what readiness actually means here.
          #
          # failureThreshold on startup allows five minutes. This broker has
          # logged "Time to start RabbitMQ: 129435 ms" on a busy laptop.
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
