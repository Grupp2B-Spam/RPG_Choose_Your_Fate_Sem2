# The in-cluster address every publisher and consumer uses. The name is what makes
# "rabbitmq.choose-your-fate.svc.cluster.local" resolve, and pods in this namespace
# can use the short form, so a service needs only RABBITMQ_HOST=rabbitmq.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: choose-your-fate
  annotations:
    # Nothing scrapes these yet. They are the convention a plain Prometheus
    # install discovers targets by, so whoever adds one does not have to edit
    # this file.
    #
    # A Prometheus Operator install would want a ServiceMonitor instead, which
    # needs a CRD this cluster does not have.
    prometheus.io/scrape: "true"
    prometheus.io/port: "15692"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
