# Debugging only. The broker is infrastructure and is not routed through the
# ingress, which exists for the system's HTTP APIs.
#
# The management UI on 31672 is how queue topology is inspected by hand; 30672
# lets a local tool connect to AMQP without a pod. Delete this file to close both
# doors; nothing depends on it.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodeport
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: choose-your-fate
    choose-your-fate/purpose: debug
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
