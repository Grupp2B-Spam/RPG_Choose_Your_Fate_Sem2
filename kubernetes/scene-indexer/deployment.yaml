# SceneIndexer -- the projector that builds the scene read model from events.
#
# No service.yaml here, and that is not an omission: nothing calls the indexer,
# it consumes from a queue. A Deployment with no Service is unreachable.
#
# THIS POD HAS NO PROBES. The service sets spring.main.web-application-type to
# none, so there is no listening port for a probe to ask. Kubernetes restarts it
# if the process exits and does nothing if it hangs with its broker connection
# gone. Fixing it means changing somebody else's service; the README writes it up.
#
# It connects to MongoDB as the indexer user, the only one with readWrite on the
# scenes database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-indexer
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: scene-indexer
    app.kubernetes.io/component: projector
    app.kubernetes.io/part-of: choose-your-fate
spec:
  # One replica, as a decision rather than a default. Scaling a consumer means
  # competing consumers on one queue, which loses ordering. sceneVersion would
  # tolerate that, but the KEDA ScaledObject to drive it is not installed.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-indexer
        app.kubernetes.io/component: projector
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      # Longer than the Spring shutdown timeout, so a message being projected when
      # the pod is terminated is finished instead of redelivered. The handler is
      # idempotent, so a redelivery is duplicated work, not corruption.
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z scene-read-model 27017 && nc -z rabbitmq 5672; do echo waiting; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: scene-indexer
          image: registry.invalid/scene-indexer:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: indexer-uri
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
