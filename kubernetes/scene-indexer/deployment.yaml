# SceneIndexer -- the projector that builds the scene read model from events.
#
# There is no service.yaml in this folder and that is not an omission. Nothing
# calls the indexer; it consumes from a queue. A Deployment with no Service is
# exactly how a workload is made unreachable, and it is a cleaner mechanism than
# leaving a port open that nothing is meant to use.
#
# THIS POD HAS NO PROBES. It is the one gap in this tree that no manifest can
# close. The service sets spring.main.web-application-type to none, so there is
# no HTTP server and no listening port -- there is nothing for a liveness or a
# readiness probe to ask, over HTTP or over TCP. Kubernetes will restart it if
# the process exits and will do nothing at all if it hangs with its broker
# connection gone. Closing this needs roughly four lines in the service: drop
# the web-application-type override and add spring-boot-starter-actuator. That
# is a change to somebody else's service, so the README writes it up as a
# proposal rather than making it here.
#
# It connects to MongoDB as the indexer user, the only one with readWrite on the
# scenes database. One writer, enforced by the database rather than by habit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-indexer
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: scene-indexer
    app.kubernetes.io/component: projector
    app.kubernetes.io/part-of: choose-your-fate
spec:
  # One replica, as a decision rather than a default. Scaling a consumer means
  # competing consumers on one queue, which loses ordering. This projection is
  # guarded by sceneVersion and would tolerate that; the KEDA ScaledObject that
  # would drive it on queue depth is not installed, so the count stays where a
  # human put it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-indexer
        app.kubernetes.io/component: projector
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      # Longer than the Spring shutdown timeout, so a message being projected
      # when the pod is terminated is finished instead of redelivered. Delivery
      # is at-least-once and the handler is idempotent, so a redelivery is not a
      # correctness problem -- it is duplicated work and log noise that reads
      # like an application bug.
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z scene-read-model 27017 && nc -z rabbitmq 5672; do echo waiting; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: scene-indexer
          image: registry.invalid/scene-indexer:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: scene-read-model-credentials
                  key: indexer-uri
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
