# StoryContentManager -- the authoring side of the content model.
#
# The only service with spring-boot-starter-actuator in its pom, so the only one
# with real HTTP probes. The others are probed on their TCP port; see the README.
#
# Everything below is set as an environment variable, so the same image runs under
# compose and here with no change to the service's source.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storycontent-manager
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: storycontent-manager
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storycontent-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storycontent-manager
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      # Must exceed the Spring shutdown timeout below, or Kubernetes kills the
      # process in the middle of the work it was given time to finish.
      terminationGracePeriodSeconds: 45
      initContainers:
        # The pod waits for the broker, so "apply everything at once" needs no
        # ordering a human has to remember. Without it the service crash-loops
        # until the broker happens to be up, which looks like a fault.
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting for rabbitmq:5672"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: storycontent-manager
          image: registry.invalid/storycontent-manager:0.1.0
          # An explicit version tag, never :latest. With IfNotPresent, an image
          # built locally on Docker Desktop runs without a registry. :latest would
          # default the policy to Always and force a registry lookup.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            # Unused by the skeleton on main, which has no datasource at all.
            # Set now so that merging the branch that adds persistence is a
            # change to the service and not also a change to this file.
            - name: MYSQL_URI
              value: jdbc:mysql://story-content-vault:3306/story_content
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: story-content-vault-credentials
                  key: root-password
            # Every write here both persists and publishes, so without the broker
            # the service would accept a write and tell nobody. The broker belongs
            # in readiness and not in liveness: restarting will not bring RabbitMQ
            # back.
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: readinessState,rabbit
            # Finish the in-flight request before exiting, on every deploy and
            # scale-down.
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              # A request, not just a limit: without it an HPA has no
              # denominator and sits at <unknown>/70% forever.
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
