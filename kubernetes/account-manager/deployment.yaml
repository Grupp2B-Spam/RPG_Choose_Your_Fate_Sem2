# AccountManager -- serves the RS256 public key over a versioned SOAP contract.
#
# It only distributes the verification key so far; account storage, login and
# token signing are still to be written. The ingress does not call it to
# authenticate requests and must not start to: every protected service verifies
# tokens locally against this key.
#
# ACCOUNT_MANAGER_BIND_ADDRESS is the setting to notice. The service defaults to
# 127.0.0.1, which inside a pod means every request is refused while the pod
# still looks healthy. The Dockerfile overrides it; it is set here too so the
# manifest states the requirement rather than inheriting it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-manager
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: account-manager
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-manager
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: account-manager
          image: registry.invalid/account-manager:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: ACCOUNT_MANAGER_BIND_ADDRESS
              value: 0.0.0.0
            - name: ACCOUNT_MANAGER_PORT
              value: "8092"
            # The service reads this key at startup and exits if it cannot, so
            # the Secret has to exist before the pod. scripts/setup.ps1 creates
            # it; without it the pod stops at CreateContainerConfigError.
            - name: JWT_PUBLIC_KEY_FILE
              value: /app/config/account-jwt-public.pem
            - name: JWT_ISSUER
              value: http://localhost:8092
            - name: JWT_AUDIENCE
              value: choose-your-fate
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          # TCP, no Actuator in the pom. See the README on probes.
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/config
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: jwt-public-key
          secret:
            secretName: jwt-public-key
            # The same key, under the filename this service expects. One keypair
            # in the system: AccountManager hands out the public half and
            # RecapManager verifies with it, so two Secrets could disagree.
            items:
              - key: public.pem
                path: account-jwt-public.pem
            # The image runs as uid 10001, so the file has to be world readable.
            defaultMode: 0444
