# Debugging only -- see storycontent-manager/nodeport.yaml for the reasoning.
# Useful here for fetching the WSDL at /ws/account-v1.wsdl without going through
# the gateway.
apiVersion: v1
kind: Service
metadata:
  name: account-manager-nodeport
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: account-manager
    app.kubernetes.io/part-of: choose-your-fate
    choose-your-fate/purpose: debug
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: account-manager
  ports:
    - name: http
      port: 8092
      targetPort: http
      nodePort: 30092
