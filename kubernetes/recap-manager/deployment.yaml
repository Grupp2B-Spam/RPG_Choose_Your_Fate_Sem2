# RecapManager -- generates and stores per-character journey summaries.
#
# The service does not enable graceful shutdown; this manifest turns it on from
# the environment without touching its source. The probes are the remaining gap
# -- see the comment on them.
#
# StoryPathManager does not exist yet, so STORYPATH_MODE stays on the mock the
# service ships. The recaps it produces are placeholder until that service exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recap-manager
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/name: recap-manager
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: choose-your-fate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recap-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recap-manager
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: choose-your-fate
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-recap-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z recap-vault 3306; do echo "waiting for recap-vault:3306"; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: recap-manager
          image: registry.invalid/recap-manager:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: MYSQL_URI
              value: jdbc:mysql://recap-vault:3306/recap-vault
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recap-vault-credentials
                  key: root-password
            # The service verifies RS256 tokens against this key. Mounted from a
            # Secret rather than from the developer's disk, which is what the
            # compose file does.
            - name: JWT_PUBLIC_KEY_LOCATION
              value: file:/app/config/recap-jwt-public.pem
            # Kept at the compose default. AccountManager does not issue tokens
            # yet, so the only ones that exist are minted by hand against this
            # issuer, and changing it here would invalidate them.
            - name: JWT_ISSUER
              value: http://localhost:8092
            - name: JWT_AUDIENCE
              value: choose-your-fate
            # There is no Ollama in this cluster. Left at true, the AI path would
            # fail at call time with a connection error instead of being off.
            - name: AI_ENABLED
              value: "false"
            - name: STORYPATH_MODE
              value: mock
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          # TCP probes, not HTTP, and that is weaker: the pom has no
          # spring-boot-starter-actuator, so there is no /actuator/health to ask,
          # and a pod with an exhausted connection pool still accepts TCP and
          # still gets traffic.
          #
          # Adding the dependency alone would not fix it: this service's
          # SecurityConfig ends in anyRequest().authenticated(), so an
          # unauthenticated probe would get 401. The README writes up both halves
          # for the group; the change is not made here, in somebody else's service.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/config
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: jwt-public-key
          secret:
            secretName: jwt-public-key
            items:
              - key: public.pem
                path: recap-jwt-public.pem
