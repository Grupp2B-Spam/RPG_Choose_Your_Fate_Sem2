# The player-facing route group.
#
# This and ingress-admin.yaml are two route groups on ONE controller, not two
# gateways. They are split by audience, authors against players, because that is
# what decides how much traffic a caller is allowed.
#
# The gateway routes, rate-limits and terminates TLS. It does NOT verify tokens:
# open source ingress-nginx cannot check an RS256 signature, and auth-request
# forwarding would put AccountManager on the critical path of every request. The
# security boundary is each service, which verifies the token itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: choose-your-fate-public
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/part-of: choose-your-fate
    choose-your-fate/route-group: public
  annotations:
    # Generous relative to the admin group. Players make many small requests; the
    # limit is here to blunt a runaway client.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # Off because the certificate is self-signed and every curl would stop to
    # complain about it. TLS still terminates here. Turn this on anywhere real.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: choose-your-fate-tls
  rules:
    - host: localhost
      http:
        paths:
          # The prefixes under /choose-your-fate are listed one by one, not as a
          # catch-all: two services share that root, and a catch-all would hand
          # one of them the other's traffic. Longest matching prefix wins.
          - path: /scenes
            pathType: Prefix
            backend:
              service:
                name: scene-manager
                port:
                  name: http
          - path: /choose-your-fate/ai
            pathType: Prefix
            backend:
              service:
                name: recap-manager
                port:
                  name: http
          - path: /choose-your-fate/characters
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /choose-your-fate/inventories
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /choose-your-fate/items
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /choose-your-fate/loadout
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /choose-your-fate/quests
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /choose-your-fate/race-details
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /api/character-details
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          - path: /api/equipment
            pathType: Prefix
            backend:
              service:
                name: character-manager
                port:
                  name: http
          # The SOAP endpoint that hands out the JWT verification key, and its
          # WSDL. Routed so a service outside the cluster can fetch the key.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: account-manager
                port:
                  name: http
