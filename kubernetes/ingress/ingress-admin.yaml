# The authoring route group.
#
# Same controller, same host, same certificate as ingress-public.yaml -- one
# gateway. It is a separate object only because ingress-nginx applies these
# annotations per Ingress, so a tighter limit on /admin needs its own.
#
# The limit is a tenth of the player limit because an author request changes
# content every player is then served. It is not authentication: a rate limit
# slows a caller down, it does not ask who they are. StoryContentManager has no
# authorization yet, and that gap is in the service.
#
# The prefix is /admin, not /admin/v1. The service answers at /admin/v1/... on
# main and at /admin/... on the branch that moves the version into a header; a
# /admin prefix routes both, so that migration needs no edit here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: choose-your-fate-admin
  namespace: choose-your-fate
  labels:
    app.kubernetes.io/part-of: choose-your-fate
    choose-your-fate/route-group: admin
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: choose-your-fate-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: storycontent-manager
                port:
                  name: http
