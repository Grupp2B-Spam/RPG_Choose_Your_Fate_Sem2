asyncapi: 3.0.0

info:
  title: StoryContentManager
  version: 1.2.0
  description: |
    Owns the authored content of Choose Your Fate and is the source of truth for
    everything the writing team produces: chapters, scenes, choices, NPCs, race
    details, item definitions and quest definitions.

    This document describes what the service **publishes**. StoryContentManager
    consumes nothing — it is the head of the content pipeline.

    Conventions (exchange naming, envelope, dead-lettering, schema evolution) are
    described in ./README.md and are not repeated here.

    ## The queues already exist — bind, do not declare

    **This is an interim arrangement.** Normally a consumer declares
    its own queue and binding. For now StoryContentManager declares them on startup,
    because an exchange stores nothing: until a consumer has started for the first time
    its queue does not exist, and every event published in that window is discarded with
    no error on either side.

    So when you write a consumer for one of these events, **bind a listener to the queue
    below rather than declaring your own**:

    | Event | Queue the publisher declares | Dead-letter queue |
    |---|---|---|
    | `scene-content.updated` | `scenemanager.scene-content` | `scenemanager.scene-content.dlq` |
    | `item-definition.updated` | `charactermanager.item-rules` | `charactermanager.item-rules.dlq` |
    | `race-definition.updated` | `charactermanager.race-definitions` | `charactermanager.race-definitions.dlq` |

    Each is durable, not auto-delete and not exclusive, and carries
    `x-dead-letter-exchange: dlx` with `x-dead-letter-routing-key: <queue-name>.dlq`. The
    `dlx` exchange and the dead-letter queues are declared here too — an exchange with
    nothing bound to it discards what it receives, so declaring `dlx` alone would have left
    the dead-letter path looking configured while still losing every message.

    **Queue arguments are part of the declaration.** Redeclaring one of these queues with
    different arguments fails with `PRECONDITION_FAILED` and your service will not start.
    Prefetch, concurrency, acknowledgement mode and what you do with a dead-lettered
    message remain yours.

    If you need a queue with different arguments, or a second consumer on one of these
    events, that is a change in this service's repository. That coupling is why the
    arrangement is interim.

    ## Changes

    ### 1.2.0 — nothing on the wire changes, but consumers must act differently

    The messages are identical. What changed is who creates the queues: this service now
    declares them, so a consumer binds to an existing queue instead of declaring its own,
    and cannot choose its own queue arguments. See the section above.

    Also renames the queue for `race-definition.updated` from `charactermanager.race-cache`
    to `charactermanager.race-definitions`, since a queue the publisher owns should be
    named for what flows through it rather than for what the consumer does with it. No
    consumer had been written against the old name.

    ### 1.1.0 — additive, no consumer change required

    Every change below adds; nothing is removed, renamed or given a new meaning, so
    `schemaVersion` stays at 1 and a consumer written against 1.0.0 keeps working
    unchanged. Consumers that want the new fields opt in by reading them.

    - **New channel `race-definition.updated`.** Races were resolved to this service
      rather than to CharacterManager, because `race_details.starting_chapter_id` is a
      mandatory foreign key into story content. CharacterManager needs *race → starting
      chapter* at character creation and is expected to cache these events rather than
      ask for a race per creation.
    - **`Choice.effects`** — the authored effect of taking a choice, as a typed list.
      SceneManager is specified to put "the effects" into `player-choice.made`, which it
      can only do if it receives them. Previously only item grants were published.
    - **`Choice.requirements`** — the authored precondition for a choice being offered,
      as a typed list. Carried in the event so that the state side can evaluate it
      without calling back into this service.
    - **`Choice.grantedItemIds` is now derived** and kept only for consumers already
      written against it. It is exactly the `itemId` values of the `GRANT_ITEM` entries
      in `effects`. New consumers should read `effects`.
    - **`ItemDefinitionPayload.requirements` and `.modifiers` now say which keys they
      use** (`intelligence`, `charisma`, `fashion`). This records what the publisher has
      always sent rather than narrowing anything. The 1.0.0 example showed `attack`, which
      is not a statistic a character has; the examples are corrected.
    - **`Envelope.payload` is now declared** among the envelope's properties. It was listed
      as required in 1.0.0 but never defined, so anyone generating a type from that schema
      alone got an envelope with no body. Nothing on the wire changes.
  contact:
    name: StoryContentManager owner
  license:
    name: Course project

defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from docker-compose, development environment
  cluster:
    host: rabbitmq.default.svc.cluster.local:5672
    protocol: amqp
    description: RabbitMQ inside the local Kubernetes cluster

channels:
  sceneContentUpdated:
    address: scene-content.updated
    description: |
      Published whenever anything inside a scene's aggregate changes: the scene
      itself, one of its choices, an NPC placed in it, or a quest attached to it.

      The message carries the **complete scene as the read side needs it**, not a
      notification to go and fetch it, so SceneManager's projector never calls back into
      StoryContentManager.
    messages:
      sceneContentUpdated:
        $ref: '#/components/messages/SceneContentUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: storycontent.events
          type: topic
          durable: true
          autoDelete: false

  itemDefinitionUpdated:
    address: item-definition.updated
    description: |
      Published when an item definition is created, changed or retired.

      Carries only the fields a consumer needs to enforce rules — slot, requirements
      and modifiers — not the presentation fields. Clients fetch names and descriptions
      from the content read side, which is static and cacheable.
    messages:
      itemDefinitionUpdated:
        $ref: '#/components/messages/ItemDefinitionUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: storycontent.events
          type: topic
          durable: true
          autoDelete: false

  raceDefinitionUpdated:
    address: race-definition.updated
    description: |
      Published when a race definition is created, changed or retired.

      A race decides where a new character begins, so CharacterManager needs this at every
      character creation. It is an event the consumer caches rather than a synchronous
      call, so character creation does not depend on this admin-only service being
      reachable.

      The payload carries `startingSceneId` as well as `startingChapterId`. The scene
      belongs to the chapter, not the race, but including it lets the consumer place a new
      character without a second lookup.

      The consequence for publishers: changing a chapter's starting scene changes the
      correct answer for every race that starts in it. This service republishes those
      races, with a new `raceVersion`, when that happens.
    messages:
      raceDefinitionUpdated:
        $ref: '#/components/messages/RaceDefinitionUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: storycontent.events
          type: topic
          durable: true
          autoDelete: false

operations:
  publishSceneContentUpdated:
    action: send
    channel:
      $ref: '#/channels/sceneContentUpdated'
    summary: Publish the current state of a scene aggregate
    messages:
      - $ref: '#/channels/sceneContentUpdated/messages/sceneContentUpdated'

  publishItemDefinitionUpdated:
    action: send
    channel:
      $ref: '#/channels/itemDefinitionUpdated'
    summary: Publish the current state of an item definition
    messages:
      - $ref: '#/channels/itemDefinitionUpdated/messages/itemDefinitionUpdated'

  publishRaceDefinitionUpdated:
    action: send
    channel:
      $ref: '#/channels/raceDefinitionUpdated'
    summary: Publish the current state of a race definition
    messages:
      - $ref: '#/channels/raceDefinitionUpdated/messages/raceDefinitionUpdated'

components:

  messages:
    SceneContentUpdated:
      name: SceneContentUpdated
      title: Scene content updated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SceneContentUpdatedEnvelope'
      examples:
        - name: sceneWithChoiceAndQuest
          payload:
            eventId: 0f9c2d1e-7a41-4f0c-9d8e-3b2a1c5e6f70
            eventType: scene-content.updated
            occurredAt: '2026-11-17T13:42:01.284Z'
            schemaVersion: 1
            payload:
              sceneId: 42
              sceneVersion: 7
              status: PUBLISHED
              chapterId: 3
              name: The innkeeper
              description: A low fire burns in the hearth. The innkeeper watches you.
              choices:
                - choiceId: 118
                  label: Trust him
                  beat: You chose to trust the innkeeper.
                  destinationSceneId: 58
                  weight: 2
                  grantedItemIds: [31]
                  requirements: []
                  effects:
                    - kind: GRANT_ITEM
                      itemId: 31
                    - kind: GRANT_FLAG
                      flag: trusted-the-innkeeper
                - choiceId: 119
                  label: Keep your hand on your sword
                  beat: You kept your hand on your sword.
                  destinationSceneId: 59
                  weight: 1
                  grantedItemIds: []
                  requirements:
                    - kind: ITEM
                      itemId: 31
                  effects:
                    - kind: MODIFY_STAT
                      stat: charisma
                      amount: -1
                    - kind: GRANT_QUEST
                      questId: 5
              npcIds: [12]
              questIds: [5]

    ItemDefinitionUpdated:
      name: ItemDefinitionUpdated
      title: Item definition updated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ItemDefinitionUpdatedEnvelope'
      examples:
        - name: swordRebalanced
          payload:
            eventId: 6b1f0a93-55de-4a1c-bb20-9f7e4d2c8a11
            eventType: item-definition.updated
            occurredAt: '2026-11-17T14:05:33.001Z'
            schemaVersion: 1
            payload:
              itemId: 31
              itemVersion: 4
              status: ACTIVE
              type: EQUIPMENT
              slot: MAINHAND
              requirements:
                fashion: 2
              modifiers:
                charisma: 2
        - name: itemRetired
          payload:
            eventId: c0a4e2b7-3d19-4b88-91aa-7e5f0d3c1b62
            eventType: item-definition.updated
            occurredAt: '2026-11-17T14:11:02.447Z'
            schemaVersion: 1
            payload:
              itemId: 31
              itemVersion: 5
              status: RETIRED
              type: EQUIPMENT
              slot: MAINHAND
              requirements: {}
              modifiers:
                charisma: 2

    RaceDefinitionUpdated:
      name: RaceDefinitionUpdated
      title: Race definition updated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RaceDefinitionUpdatedEnvelope'
      examples:
        - name: raceCreated
          payload:
            eventId: 8d3f1b60-2c74-4f52-9a0d-5e81c6b40f93
            eventType: race-definition.updated
            occurredAt: '2026-11-22T09:14:27.512Z'
            schemaVersion: 1
            payload:
              raceId: 3
              raceVersion: 1
              status: ACTIVE
              name: smalls
              startingChapterId: 4
              startingSceneId: 4
        - name: republishedBecauseTheChapterMovedItsStartingScene
          payload:
            eventId: 2a77c419-9e0b-4d36-8c15-61fd0a2e7b84
            eventType: race-definition.updated
            occurredAt: '2026-11-22T09:31:05.908Z'
            schemaVersion: 1
            payload:
              raceId: 3
              raceVersion: 2
              status: ACTIVE
              name: smalls
              startingChapterId: 4
              startingSceneId: 104

  schemas:

    Envelope:
      type: object
      description: Outer shape shared by every message in the system. See ./README.md.
      required: [eventId, eventType, occurredAt, schemaVersion, payload]
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique per publication. Consumers deduplicate on this.
        eventType:
          type: string
          description: Identical to the routing key.
        occurredAt:
          type: string
          format: date-time
          description: When the fact happened, not when it was published.
        schemaVersion:
          type: integer
          minimum: 1
          description: Incremented only on a breaking change to payload.
        payload:
          type: object
          description: |
            The event body. Each concrete envelope below narrows this to the payload of its
            event type.

    SceneContentUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType:
              const: scene-content.updated
            payload:
              $ref: '#/components/schemas/ScenePayload'

    ItemDefinitionUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType:
              const: item-definition.updated
            payload:
              $ref: '#/components/schemas/ItemDefinitionPayload'

    RaceDefinitionUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType:
              const: race-definition.updated
            payload:
              $ref: '#/components/schemas/RaceDefinitionPayload'

    ScenePayload:
      type: object
      required: [sceneId, sceneVersion, status, chapterId, name, choices]
      properties:
        sceneId:
          type: integer
          description: Stable identifier, carried over from the relational model.
        sceneVersion:
          type: integer
          minimum: 1
          description: |
            Incremented on every publication of this scene. A consumer must ignore a
            message whose version is not newer than what it already holds. RabbitMQ
            guarantees order within a queue but not across redeliveries, so this is what
            makes the projection safe.
        status:
          type: string
          enum: [PUBLISHED, RETIRED]
          description: |
            RETIRED withdraws the scene from delivery. Not a deletion: existing paths
            reference this scene and must keep resolving. The read side stops serving it.
        chapterId:
          type: integer
        name:
          type: string
        description:
          type: string
          description: The prose shown to the player.
        choices:
          type: array
          description: Every choice available in this scene, in presentation order.
          items:
            $ref: '#/components/schemas/Choice'
        npcIds:
          type: array
          description: NPCs placed in this scene.
          items:
            type: integer
        questIds:
          type: array
          description: Quests offered in this scene.
          items:
            type: integer

    Choice:
      type: object
      required: [choiceId, label, beat, destinationSceneId]
      properties:
        choiceId:
          type: integer
        label:
          type: string
          description: The text on the choice, as shown to the player.
        beat:
          type: string
          description: |
            One sentence describing what happens if this choice is taken, written by the
            author. SceneManager copies it into PlayerChoice.made, so the path records what
            happened rather than a reference to content that may change.
        destinationSceneId:
          type: integer
        weight:
          type: integer
          description: Authoring weight, used when summarising a path.
        grantedItemIds:
          type: array
          description: |
            Derived, and kept only for consumers written against 1.0.0. Exactly the
            `itemId` values of the `GRANT_ITEM` entries in `effects`. New consumers should
            read `effects` instead; this field will be removed once nobody reads it, which
            is a breaking change and will be announced before it happens.
          items:
            type: integer
        requirements:
          type: array
          description: |
            What must already be true for this choice to be offered. Authored here;
            evaluated by the state side, which is the only side that knows what a character
            holds.

            The condition travels in the event rather than being looked up, so the consumer
            never calls back. An empty or absent list means the choice is always offered.
          items:
            $ref: '#/components/schemas/ChoiceRequirement'
        effects:
          type: array
          description: |
            What taking this choice does, as a typed list in application order.

            Typed rather than a free-form code plus an integer: across a service boundary
            the consumer cannot tell a quest id from an item id from an amount. The
            publisher validates these at write time, which is what lets a consumer react to
            an event without ever rejecting it as invalid.

            Moving to the destination scene is **not** an effect; that is
            `destinationSceneId`, which every choice already carries.
          items:
            $ref: '#/components/schemas/ChoiceEffect'

    ChoiceRequirement:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [STORY_FLAG, ITEM]
        flag:
          type: string
          description: |
            Present only for STORY_FLAG. The flag's name is authored here; whether a
            character holds it is state. The two sides share this vocabulary and neither
            owns a table for it, so the name is carried verbatim in the event.
        itemId:
          type: integer
          description: Present only for ITEM. The character must hold this item.

    ChoiceEffect:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [GRANT_ITEM, GRANT_QUEST, COMPLETE_QUEST, MODIFY_STAT, GRANT_FLAG]
        itemId:
          type: integer
          description: Present only for GRANT_ITEM.
        questId:
          type: integer
          description: Present only for GRANT_QUEST and COMPLETE_QUEST.
        stat:
          type: string
          enum: [intelligence, charisma, fashion]
          description: |
            Present only for MODIFY_STAT. Enumerated, so an authored effect naming a
            statistic a character does not have cannot reach a consumer.

            Lower case, unlike every other enumeration in this document. Statistic names
            were already published in lower case as the keys of
            `ItemDefinitionPayload.requirements` and `.modifiers` in 1.0.0, and respelling
            those would break consumers already parsing them.
        amount:
          type: integer
          description: |
            Present only for MODIFY_STAT. A delta, which may be negative. Deltas commute,
            which is what allows the consumer of `player-choice.made` to be scaled
            horizontally.
        flag:
          type: string
          description: Present only for GRANT_FLAG. The story flag this choice sets.

    RaceDefinitionPayload:
      type: object
      required: [raceId, raceVersion, status, name, startingChapterId]
      properties:
        raceId:
          type: integer
        raceVersion:
          type: integer
          minimum: 1
          description: |
            Same purpose as sceneVersion and itemVersion — lets a consumer discard a stale
            or redelivered message. Bumped both when the race itself changes and when the
            starting scene of its chapter changes, since the second changes the payload
            without changing the race.
        status:
          type: string
          enum: [ACTIVE, RETIRED]
          description: |
            RETIRED withdraws the race from character creation. Not a deletion: existing
            characters have this race and must keep resolving.
        name:
          type: string
        startingChapterId:
          type: integer
          description: Where a character of this race begins.
        startingSceneId:
          type: integer
          description: |
            The starting scene of `startingChapterId`, copied in so the consumer can place
            a new character without a second lookup. Absent only if the chapter has no
            starting scene yet, which means the content is unfinished.

    ItemDefinitionPayload:
      type: object
      required: [itemId, itemVersion, status, type]
      properties:
        itemId:
          type: integer
        itemVersion:
          type: integer
          minimum: 1
          description: Same purpose as sceneVersion — lets a consumer discard stale messages.
        status:
          type: string
          enum: [ACTIVE, RETIRED]
          description: |
            RETIRED withdraws the item from being granted or acquired. Not a deletion: a
            player who owns one must still be able to see and use it.
        type:
          type: string
          enum: [EQUIPMENT, CONSUMABLE, QUEST]
        slot:
          type: string
          enum: [HEAD, CHEST, LEGS, MAINHAND]
          description: Only present for EQUIPMENT.
        requirements:
          type: object
          description: |
            Minimum character statistics required to equip the item. Absent statistics
            mean no requirement, so an empty object and an absent one say the same thing.

            The keys are statistic names in lower case, the same vocabulary as
            `ChoiceEffect.stat` — see `propertyNames` below. Documented in 1.1.0; the
            publisher has never sent anything else.
          propertyNames:
            enum: [intelligence, charisma, fashion]
          additionalProperties:
            type: integer
        modifiers:
          type: object
          description: |
            Effect on character statistics while equipped. Same key vocabulary as
            `requirements`.
          propertyNames:
            enum: [intelligence, charisma, fashion]
          additionalProperties:
            type: integer
