spring.application.name=account-manager
server.address=${ACCOUNT_MANAGER_BIND_ADDRESS:127.0.0.1}
server.port=${ACCOUNT_MANAGER_PORT:8092}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8082/realms/choose-your-fate}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences[0]=${OIDC_AUDIENCE:account-manager}
spring.security.oauth2.resourceserver.jwt.jws-algorithms[0]=RS256
