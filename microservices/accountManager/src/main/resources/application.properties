spring.application.name=account-manager
server.address=${ACCOUNT_MANAGER_BIND_ADDRESS:127.0.0.1}
server.port=${ACCOUNT_MANAGER_PORT:8092}
spring.webservices.path=/ws
spring.webservices.servlet.init.transformWsdlLocations=true

app.jwt.public-key-file=${JWT_PUBLIC_KEY_FILE:./.local/account-jwt-public.pem}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8092}
app.jwt.audience=${JWT_AUDIENCE:choose-your-fate}
