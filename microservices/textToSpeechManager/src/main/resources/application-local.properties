# Never enable this profile in Knative: the local listener bypasses request-based activation.
spring.config.import=optional:file:./.env[.properties]
# Defaults match this service's Compose dependencies, not another service's vault.
spring.datasource.url=${MYSQL_URI:jdbc:mysql://localhost:3313/tts_metadata?connectionTimeZone=UTC}
spring.datasource.username=${MYSQL_USERNAME:${TTS_MYSQL_USERNAME:tts_local}}
spring.datasource.password=${MYSQL_PASSWORD:${TTS_MYSQL_PASSWORD:tts-local-development}}
tts.minio-endpoint=${MINIO_ENDPOINT:http://localhost:9002}
tts.minio-public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9002}
tts.minio-access-key=${MINIO_ACCESS_KEY:local_minio}
tts.minio-secret-key=${MINIO_SECRET_KEY:${TTS_LOCAL_MINIO_PASSWORD:minio-local-development-only}}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:${RABBITMQ_USER:rabbitmq}}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=20
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
tts.provider-mode=${TTS_PROVIDER_MODE:mock}
tts.mock-audio-file=${TTS_MOCK_AUDIO_FILE:classpath:mock-data/local-tone.mp3}
tts.local-public-key=${JWT_PUBLIC_KEY_LOCATION:file:../recapManager/.local/recap-jwt-public.pem}
tts.local-issuer=${JWT_ISSUER:http://localhost:8092}
tts.local-audience=${JWT_AUDIENCE:choose-your-fate}
