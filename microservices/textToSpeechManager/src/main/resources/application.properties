spring.application.name=text-to-speech-manager
# Armeria serves HTTP/1.1 and HTTP/2/gRPC together. No second Tomcat listener.
spring.main.web-application-type=none
tts.port=${PORT:9093}
tts.voice=${SPEECH_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
tts.model=${SPEECH_MODEL:eleven_turbo_v2_5}
tts.format=${SPEECH_OUTPUT_FORMAT:mp3_44100_128}
tts.max-characters=${TTS_MAX_CHARACTERS:10000}
tts.max-wait-millis=${TTS_MAX_WAIT_MILLIS:5000}
tts.max-attempts=${TTS_MAX_ATTEMPTS:3}
tts.lease-seconds=${TTS_LEASE_SECONDS:180}
tts.provider-mode=${TTS_PROVIDER_MODE:elevenlabs}
tts.provider-url=${TTS_PROVIDER_URL:https://api.elevenlabs.io}
tts.provider-key=${ELEVEN_LABS_API_KEY:}
tts.provider-timeout-seconds=${TTS_PROVIDER_TIMEOUT_SECONDS:30}
tts.max-audio-bytes=${TTS_MAX_AUDIO_BYTES:20971520}
tts.mock-audio-file=${TTS_MOCK_AUDIO_FILE:}

spring.datasource.url=${MYSQL_URI}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=5000
spring.jdbc.template.query-timeout=3s
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

tts.minio-endpoint=${MINIO_ENDPOINT}
tts.minio-public-endpoint=${MINIO_PUBLIC_ENDPOINT}
tts.minio-access-key=${MINIO_ACCESS_KEY}
tts.minio-secret-key=${MINIO_SECRET_KEY}
tts.minio-bucket=${MINIO_BUCKET:tts-audio}
tts.minio-region=${MINIO_REGION:us-east-1}
tts.url-lifetime-seconds=${AUDIO_URL_LIFETIME_SECONDS:900}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
tts.exchange=${RECAP_EVENTS_EXCHANGE:choose-your-fate.recap}
tts.routing-key=${RECAP_EVENTS_ROUTING_KEY:recap.generated.v2}
tts.queue=${TTS_QUEUE:text-to-speech-manager.recap-generated}
tts.confirm-timeout-millis=${TTS_CONFIRM_TIMEOUT_MILLIS:1000}

tts.jwt-issuer=${KEYCLOAK_ISSUER_URI}
tts.jwt-audience=${KEYCLOAK_AUDIENCE}
tts.jwt-jwks=${KEYCLOAK_JWK_SET_URI}
tts.jwt-client-id=${KEYCLOAK_ROLE_CLIENT_ID:}
tts.jwt-user-role=${KEYCLOAK_USER_ROLE:USER}
tts.jwt-admin-role=${KEYCLOAK_ADMIN_ROLE:ADMIN}
# Event-delivery identity is separate from player identity, even when using the same issuer.
tts.event-issuer=${TTS_EVENT_JWT_ISSUER}
tts.event-audience=${TTS_EVENT_JWT_AUDIENCE}
tts.event-jwks=${TTS_EVENT_JWT_JWKS_URI}
tts.event-subjects=${TTS_EVENT_JWT_SUBJECTS}

logging.level.root=INFO
