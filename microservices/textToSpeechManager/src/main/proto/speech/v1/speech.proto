syntax = "proto3";

package choose_your_fate.speech.v1;
option java_package = "dk.ek.gruppe2.ttsmanager.grpc.speech.v1";
option java_multiple_files = true;

// Wire-compatible with RecapManager; Java package is local to this service.
service SpeechService {
  // TTS selects synthesis settings and computes the cache identity from the text.
  // Wait at most wait_millis; return PENDING if generation is still in progress.
  rpc GetOrCreateSpeech (SpeechRequest) returns (SpeechResponse);
}

message SpeechRequest {
  reserved 1, 3, 4, 5;
  reserved "content_hash", "voice_id", "model", "output_format";
  string text = 2;
  int64 wait_millis = 6;
}

message SpeechResponse {
  string content_hash = 1;
  SpeechStatus status = 2;
  // Only present for READY. TTS owns the audio storage and URL lifetime.
  string audio_url = 3;
}

enum SpeechStatus {
  SPEECH_STATUS_UNSPECIFIED = 0;
  READY = 1;
  PENDING = 2;
  FAILED = 3;
}
