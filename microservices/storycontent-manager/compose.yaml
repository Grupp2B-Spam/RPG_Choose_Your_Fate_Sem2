# StoryContentManager and the database it owns.
#
# Included from the root docker-compose.yml, so service names here share a namespace with
# every other included file — hence the full names rather than "backend" and "db".
#
# Relative paths resolve against THIS file's directory, so "docker compose up -d" from here
# still works.

services:
  storycontent-manager:
    profiles: ["prod"]
    build: .
    container_name: storycontent-manager
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MYSQL_URI: jdbc:mysql://story-content-vault:3306/story_content
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${STORY_CONTENT_ROOT_PASSWORD:-123456}
    depends_on:
      story-content-vault:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  story-content-vault:
    image: mysql:9.5.0
    container_name: story-content-vault
    ports:
      # 3307 and 3308 are taken by the monolith's primary and secondary.
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${STORY_CONTENT_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: story_content
    volumes:
      - story-content-vault:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    hostname: story-content-vault
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${STORY_CONTENT_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  story-content-vault:
    driver: local
