spring:
  application:
    name: storycontent-manager
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:rabbitmq}}
    password: ${RABBITMQ_PASSWORD:rabbitmq}
    # Required for the returns callback in RabbitConfig to fire. The mandatory flag on
    # the template asks the broker to hand back unroutable messages; this is what makes
    # the connection able to receive them.
    publisher-returns: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    dk.ek.gruppe2.storycontent: DEBUG
