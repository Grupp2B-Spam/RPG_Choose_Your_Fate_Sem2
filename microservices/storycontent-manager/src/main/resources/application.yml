spring:
  application:
    name: storycontent-manager

  # Every host and credential comes from the environment with a local default, so the same
  # image runs unchanged everywhere. The default is the port compose publishes: 3309, since
  # 3307 and 3308 are the monolith's.
  datasource:
    url: ${MYSQL_URI:jdbc:mysql://localhost:3309/story_content}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

  jpa:
    hibernate:
      # validate, never update. The schema lives as SQL in db-init/ and that is what the
      # database is built from. Startup then checks the entities against it: a column added
      # to an entity but forgotten in the SQL fails the boot.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Building a scene payload walks the choices, then each choice's requirements and
        # effects. Without batching that is one query per choice per collection.
        default_batch_fetch_size: 32

  jackson:
    # The payloads set only the fields belonging to an effect's or a requirement's kind;
    # the rest are null and must not appear on the wire. The contract says absent, and
    # absent and null are not the same statement to a consumer.
    default-property-inclusion: non_null

    # occurredAt is an ISO-8601 instant in the contract. That is Spring Boot's default and
    # is deliberately NOT pinned here: Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS, so the
    # property no longer binds and fails the context at startup. ContractShapeTest asserts
    # the serialised form instead.

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Required for the returns callback in RabbitConfig to fire.
    publisher-returns: true

  # Kubernetes sends SIGTERM on every deploy, scale-down and node drain; without this the
  # process dies mid-request. The pod's terminationGracePeriodSeconds must exceed this
  # value, or Kubernetes kills the pod before the timeout can expire.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # Splits /actuator/health/liveness from /actuator/health/readiness.
      probes:
        enabled: true
      group:
        # A service that cannot reach RabbitMQ or its own database must not receive
        # traffic: every write here both persists and publishes. Liveness includes neither
        # — restarting the process will not bring a dependency back.
        readiness:
          include: readinessState,rabbit,db

logging:
  level:
    dk.ek.gruppe2.storycontent: DEBUG
