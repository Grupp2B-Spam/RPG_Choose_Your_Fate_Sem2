# MySQL initializes the recap schema from src/main/resources/01_schema_recap_vault.sql.
# The seeding only happens on the first start when the volume is created.
# If you need to reset the seeding, run "docker compose down -v" to delete the volume.
services:
  # Named after the service rather than "backend": after include, service names share
  # one namespace across every included file, so two services both called "backend"
  # would silently override one another.
  recap-manager:
    profiles: ["prod"]
    build: .
    container_name: recap-manager
    ports:
      - "8090:8090"
    environment:
      MYSQL_URI: jdbc:mysql://recap-vault:3306/recap-vault
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      AI_ENABLED: true
      JWT_MODE: ${JWT_MODE:-keycloak}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-}
      KEYCLOAK_JWK_TIMEOUT_MILLIS: ${KEYCLOAK_JWK_TIMEOUT_MILLIS:-3000}
      KEYCLOAK_ROLE_SOURCE: ${KEYCLOAK_ROLE_SOURCE:-realm}
      KEYCLOAK_ROLE_CLIENT_ID: ${KEYCLOAK_ROLE_CLIENT_ID:-}
      KEYCLOAK_USER_ROLE: ${KEYCLOAK_USER_ROLE:-USER}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-ADMIN}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
      STORYPATH_MODE: ${STORYPATH_MODE:-mock}
      STORYPATH_GRPC_TARGET: ${STORYPATH_GRPC_TARGET:-storypath-manager:9091}
      STORYPATH_GRPC_PLAINTEXT: ${STORYPATH_GRPC_PLAINTEXT:-false}
      SPEECH_MODE: ${SPEECH_MODE:-grpc}
      SPEECH_GRPC_TARGET: ${SPEECH_GRPC_TARGET:-text-to-speech-manager:9093}
      SPEECH_GRPC_PLAINTEXT: ${SPEECH_GRPC_PLAINTEXT:-true}
      SPEECH_WAIT_MILLIS: ${SPEECH_WAIT_MILLIS:-5000}
      SPEECH_MOCK_STATUS: ${SPEECH_MOCK_STATUS:-PENDING}
      SPEECH_MOCK_AUDIO_URL: ${SPEECH_MOCK_AUDIO_URL:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${RABBITMQ_USER:-rabbitmq}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq}
      RECAP_EVENTS_EXCHANGE: ${RECAP_EVENTS_EXCHANGE:-choose-your-fate.recap}
      RECAP_EVENTS_ROUTING_KEY: ${RECAP_EVENTS_ROUTING_KEY:-recap.generated.v2}
    depends_on:
      recap-vault: 
        condition: service_healthy
        
  recap-vault:
    image: mysql:9.5.0
    container_name: recap-vault
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - recap-vault:/var/lib/mysql
      - type: bind
        source: ./src/main/resources/01_schema_recap_vault.sql
        target: /docker-entrypoint-initdb.d/01_schema_recap_vault.sql
        read_only: true
        bind:
          create_host_path: false
    hostname: recap-vault
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  recap-vault:
    driver: local
