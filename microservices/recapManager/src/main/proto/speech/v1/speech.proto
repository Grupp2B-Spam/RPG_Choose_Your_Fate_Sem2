syntax = "proto3";

package choose_your_fate.speech.v1;
option java_package = "dk.ek.gruppe2.recapmanager.grpc.speech.v1";
option java_multiple_files = true;

// Proposed integration contract for the TTS team. RecapManager is the client.
service SpeechService {
  // Reuse cached/in-flight work by content_hash. Generate on a cache miss.
  // Wait at most wait_millis; return PENDING if generation is still in progress.
  rpc GetOrCreateSpeech (SpeechRequest) returns (SpeechResponse);
}

message SpeechRequest {
  string content_hash = 1;
  string text = 2;
  string voice_id = 3;
  string model = 4;
  string output_format = 5;
  int64 wait_millis = 6;
}

message SpeechResponse {
  string content_hash = 1;
  SpeechStatus status = 2;
  // Only present for READY. TTS owns the audio storage and URL lifetime.
  string audio_url = 3;
}

enum SpeechStatus {
  SPEECH_STATUS_UNSPECIFIED = 0;
  READY = 1;
  PENDING = 2;
  FAILED = 3;
}
