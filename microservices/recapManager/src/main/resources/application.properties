spring.application.name=recap-manager
spring.config.import=optional:file:./.env[.properties],optional:file:./recap-manager/.env[.properties]


spring.datasource.url=${MYSQL_URI:jdbc:mysql://localhost:3307/recap-vault}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:123456}}

#tells Hibernate to not rewrite our schema
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8090

# Verification only: no shared signing secret or remote key discovery.
app.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./.local/recap-jwt-public.pem}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8092}
app.security.jwt.audience=${JWT_AUDIENCE:choose-your-fate}
app.security.public-docs=${SWAGGER_PUBLIC:false}
# Ownership access is denied unless an implementation is explicitly enabled.
app.security.mock-character-access=false

app.ai.enabled=${AI_ENABLED:true}
app.ai.strip-markdown=${AI_STRIP_MARKDOWN:true}
spring.ai.ollama.base-url=${AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${AI_OLLAMA_CHAT_MODEL:glm-4.6:cloud}
spring.ai.ollama.chat.options.temperature=${AI_OLLAMA_TEMPERATURE:0.3}
