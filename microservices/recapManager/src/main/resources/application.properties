spring.application.name=recap-manager
spring.config.import=optional:file:./.env[.properties],optional:file:./recap-manager/.env[.properties],classpath:mock-data.properties


spring.datasource.url=${MYSQL_URI:jdbc:mysql://localhost:3307/recap-vault}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:123456}}

#tells Hibernate to not rewrite our schema
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8090

# Keycloak trust is supplied by deployment; no guessed realm/client or shared signing secret.
app.security.jwt.mode=${JWT_MODE:keycloak}
app.security.jwt.issuer=${KEYCLOAK_ISSUER_URI:}
app.security.jwt.audience=${KEYCLOAK_AUDIENCE:}
app.security.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}
app.security.jwt.jwk-timeout-millis=${KEYCLOAK_JWK_TIMEOUT_MILLIS:3000}
app.security.jwt.roles.source=${KEYCLOAK_ROLE_SOURCE:realm}
app.security.jwt.roles.client-id=${KEYCLOAK_ROLE_CLIENT_ID:}
app.security.jwt.roles.user-role=${KEYCLOAK_USER_ROLE:USER}
app.security.jwt.roles.admin-role=${KEYCLOAK_ADMIN_ROLE:ADMIN}
app.security.public-docs=${SWAGGER_PUBLIC:false}
# Ownership access is denied unless an implementation is explicitly enabled.
app.security.mock-character-access=false

app.ai.enabled=${AI_ENABLED:true}
app.ai.strip-markdown=${AI_STRIP_MARKDOWN:true}
spring.ai.ollama.base-url=${AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${AI_OLLAMA_CHAT_MODEL:glm-4.6:cloud}
spring.ai.ollama.chat.options.temperature=${AI_OLLAMA_TEMPERATURE:0.3}

# StoryPathManager owns raw choice history. TLS is the default for actual gRPC calls.
app.storypath.mode=${STORYPATH_MODE:mock}
app.storypath.target=${STORYPATH_GRPC_TARGET:localhost:9091}
app.storypath.plaintext=${STORYPATH_GRPC_PLAINTEXT:false}
app.storypath.deadline-millis=${STORYPATH_GRPC_DEADLINE_MILLIS:3000}
app.storypath.page-size=${STORYPATH_PAGE_SIZE:100}
app.storypath.max-pages=${STORYPATH_MAX_PAGES:100}
app.storypath.generation-batch-size=${RECAP_GENERATION_BATCH_SIZE:100}

# Additive outbox setup also works with an already initialized recap vault.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:02_recap_outbox.sql

# Retrieval is mocked until the other teams provide their services. Publishing is real.
app.speech.mode=${SPEECH_MODE:mock}
app.speech.target=${SPEECH_GRPC_TARGET:localhost:9093}
app.speech.plaintext=${SPEECH_GRPC_PLAINTEXT:false}
app.speech.voice-id=${SPEECH_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
app.speech.model=${SPEECH_MODEL:eleven_turbo_v2_5}
app.speech.output-format=${SPEECH_OUTPUT_FORMAT:mp3_44100_128}
app.speech.wait-millis=${SPEECH_WAIT_MILLIS:5000}
app.speech.deadline-grace-millis=${SPEECH_DEADLINE_GRACE_MILLIS:1000}
app.speech.mock-status=${SPEECH_MOCK_STATUS:PENDING}
app.speech.mock-audio-url=${SPEECH_MOCK_AUDIO_URL:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
app.recap-events.exchange=${RECAP_EVENTS_EXCHANGE:choose-your-fate.recap}
app.recap-events.routing-key=${RECAP_EVENTS_ROUTING_KEY:recap.generated.v1}
app.recap-events.poll-delay-millis=${RECAP_EVENTS_POLL_DELAY_MILLIS:2000}
app.recap-events.retry-delay-millis=${RECAP_EVENTS_RETRY_DELAY_MILLIS:10000}
app.recap-events.confirm-timeout-millis=${RECAP_EVENTS_CONFIRM_TIMEOUT_MILLIS:3000}
