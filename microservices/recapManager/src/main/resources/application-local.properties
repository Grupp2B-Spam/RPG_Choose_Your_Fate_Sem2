# Local development fixtures only. JWT signature validation remains enabled.
app.security.jwt.mode=${JWT_MODE:pem}
app.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./.local/recap-jwt-public.pem}
app.security.jwt.issuer=${KEYCLOAK_ISSUER_URI:${JWT_ISSUER:http://localhost:8092}}
app.security.jwt.audience=${KEYCLOAK_AUDIENCE:${JWT_AUDIENCE:choose-your-fate}}
app.security.public-docs=${SWAGGER_PUBLIC:true}
app.security.mock-character-access=true
app.security.mock-character-owners[1]=player-1
app.security.mock-character-owners[2]=player-2

# Shared journey fixtures are in mock-data.properties. Publishing still uses real RabbitMQ.
app.storypath.mode=${STORYPATH_MODE:mock}
