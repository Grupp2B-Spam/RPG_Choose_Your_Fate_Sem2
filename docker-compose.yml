# mysql server seeded with databases from dump files in the folder ./rpg_mysql
# The seeding only happens on the first start when the volume is created.
# If you need to reset the seeding, run "docker compose down -v" to delete the volume.
services:
  frontend:
    profiles: ["prod"]
    build:
      context: ./choose-your-fate-frontend
      args:
        VITE_API_URL: http://localhost:8080/
    ports:
      - "5173:80"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: bar-scan-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  rabbitmq-data:
