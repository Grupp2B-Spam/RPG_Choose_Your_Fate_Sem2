# Root compose for the whole system.
#
# Each microservice owns a compose file next to its code, describing the service and the
# database it owns. They are merged into one project here, so everything shares a network
# and each person edits only their own file. Relative paths inside an included file
# resolve against that file's directory, so a service also runs on its own.
include:
  - microservices/storycontent-manager/compose.yaml
  - microservices/recapManager/docker-compose-recap-manager.yml
  - microservices/accountManager/compose.yaml

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: "${OIDC_BASE_URL:-http://localhost:8082}"
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - type: bind
        source: ./microservices/auth/choose-your-fate-realm.json
        target: /opt/keycloak/data/import/choose-your-fate-realm.json
        read_only: true
        bind:
          create_host_path: false

  frontend:
    profiles: ["prod"]
    build:
      context: ./choose-your-fate-frontend
      args:
        VITE_API_URL: http://localhost:8080/
    ports:
      - "5173:80"

  # Shared message broker. The management plugin exposes a UI on 15672 where exchanges,
  # queues and bindings can be inspected while developing — without a bound queue a topic
  # exchange discards messages silently, which is otherwise hard to tell from a bug.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: choose-your-fate-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  keycloak-data:
  rabbitmq-data:
