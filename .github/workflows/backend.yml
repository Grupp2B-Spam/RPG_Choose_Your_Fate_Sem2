name: Java CI with Maven
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./choose-your-fate-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package -DskipTests
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./choose-your-fate-backend/target/*.jar
          retention-days: 1

  test:
    env:
      ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./choose-your-fate-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit and Integration Tests
        run: mvn clean verify

  # The architecture diagram is generated from docs/architecture/architecture.json and a
  # hand-authored template. This job fails when the committed .drawio no longer matches a
  # fresh render — that is, when someone edited the generated file by hand — and prints
  # the manifest's disagreements with the repository as warnings.
  #
  # Its own job rather than a step in the ones above: those set a Maven working directory
  # and install Java, none of which this needs, and the check should run whether or not
  # the backend build passes.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the diagram tooling
        run: node --test "scripts/architecture/test/*.test.js"
      - name: Verify the architecture diagram
        run: node scripts/architecture/verify.js
